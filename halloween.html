<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Puzzle Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Griffy&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0618;
    --bg2:#180a2e;
    --card:#1d1036;
    --card2:#261445;
    --orange:#ff8a3d;
    --orange2:#ffb347;
    --purple:#a45cff;
    --text:#f3ebff;
    --line:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;color:var(--text);overflow-x:hidden;
    background:
      radial-gradient(900px 600px at 85% -5%, #3a1c66 0%, transparent 60%),
      radial-gradient(700px 500px at 5% 15%, #2a1046 0%, transparent 55%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
  }

  #sky{position:fixed;inset:0;z-index:0;pointer-events:none;}

  .moon{
    position:fixed;top:6vh;right:7vw;width:112px;height:112px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d8, #ffd98a 60%, #ffb347);
    box-shadow:0 0 60px 18px rgba(255,179,71,.32),0 0 140px 55px rgba(255,138,61,.16);
    z-index:0;pointer-events:none;animation:moonPulse 6s ease-in-out infinite;
  }
  .moon::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 62% 40%, rgba(180,140,60,.25) 12%, transparent 13%),
               radial-gradient(circle at 45% 66%, rgba(180,140,60,.2) 8%, transparent 9%),
               radial-gradient(circle at 30% 44%, rgba(180,140,60,.18) 6%, transparent 7%);}
  @keyframes moonPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.12);}}
  @media (max-width:640px){ .moon{width:78px;height:78px;top:5vh;right:6vw;} }

  .bat{
    position:fixed;z-index:1;pointer-events:none;font-size:20px;
    filter:drop-shadow(0 0 8px rgba(164,92,255,.65));
    animation:fly linear infinite;opacity:.9;
  }
  @keyframes fly{
    0%{transform:translate(-12vw,0) rotate(0deg);}
    50%{transform:translate(46vw,-9vh) rotate(10deg);}
    100%{transform:translate(114vw,5vh) rotate(-6deg);}
  }

  .ghost{
    position:fixed;z-index:1;pointer-events:none;font-size:30px;opacity:.8;
    animation:floaty 7s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(200,180,255,.45));
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-24px) rotate(3deg);}
  }

  .spider{
    position:fixed;top:0;left:13%;z-index:1;pointer-events:none;
    transform-origin:top center;animation:swing 4.5s ease-in-out infinite;
  }
  .spider .thread{
    width:2px;height:118px;margin:0 auto;
    background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,.06));
  }
  .spider .body{display:block;font-size:26px;margin-top:-6px;text-align:center;
    filter:drop-shadow(0 0 8px rgba(164,92,255,.5));}
  @keyframes swing{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(7deg);}}
  @media (max-width:640px){ .spider{left:8%;} .spider .thread{height:84px;} }

  .fog{
    position:fixed;left:-60%;bottom:-40px;width:220%;height:260px;z-index:1;
    pointer-events:none;opacity:.55;filter:blur(16px);
    background:
      radial-gradient(ellipse at 28% 100%, rgba(164,92,255,.28), transparent 62%),
      radial-gradient(ellipse at 72% 100%, rgba(255,138,61,.16), transparent 62%);
    animation:drift 20s ease-in-out infinite alternate;
  }
  .fog.b{opacity:.35;height:180px;animation-duration:28s;animation-direction:alternate-reverse;}
  @keyframes drift{from{transform:translateX(-4%);}to{transform:translateX(4%);}}

  .pumpkin{
    position:fixed;bottom:5vh;z-index:2;pointer-events:none;
    font-size:clamp(38px,7vw,76px);line-height:1;
    transform-origin:50% 88%;
    filter:drop-shadow(0 0 18px rgba(255,138,61,.6));
    animation:pumpkinDance 1.05s ease-in-out infinite;
    will-change:transform;
  }
  .pumpkin.left{ left:5vw; }
  .pumpkin.right{ right:5vw; animation-duration:1.25s; animation-delay:.28s; }
  @keyframes pumpkinDance{
    0%,100%{ transform:translateY(0) rotate(-9deg) scale(1); }
    25%    { transform:translateY(-18px) rotate(7deg) scale(1.07); }
    50%    { transform:translateY(0) rotate(9deg) scale(1); }
    75%    { transform:translateY(-18px) rotate(-7deg) scale(1.07); }
  }
  @media (max-width:640px){
    .pumpkin{ bottom:3vh; font-size:clamp(32px,13vw,48px); }
    .pumpkin.left{ left:3vw; }
    .pumpkin.right{ right:3vw; }
  }

  .content{
    position:relative;z-index:3;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:48px;padding:60px 20px;
  }
  h1{
    font-family:'Creepster', system-ui, cursive;font-weight:400;
    font-size:clamp(44px,10vw,104px);text-align:center;color:#fff;
    letter-spacing:2px;line-height:1.05;
    text-shadow:0 0 14px rgba(255,138,61,.9),0 0 48px rgba(255,138,61,.55),0 0 100px rgba(164,92,255,.6);
    animation:flicker 5s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1;}92%{opacity:1;}93%{opacity:.75;}94%{opacity:1;}96%{opacity:.85;}97%{opacity:1;}
  }
  .puzzles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;max-width:760px;}
  @media (max-width:640px){ .puzzles{grid-template-columns:1fr 1fr;} }
  .puz{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;
    border-radius:24px;text-decoration:none;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,138,61,.16), transparent 60%),
      linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  .puz::before{
    content:"";position:absolute;top:0;left:16%;right:16%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,138,61,.7),transparent);
    opacity:.7;
  }
  .puz span{
    font-family:'Creepster', system-ui, cursive;font-weight:400;
    font-size:clamp(60px,16vw,104px);line-height:1;
    background:linear-gradient(180deg,var(--orange2),var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,138,61,.5));
  }
  .puz:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,138,61,.6);
    box-shadow:0 30px 64px rgba(0,0,0,.55), 0 0 40px rgba(255,138,61,.35);}

  @media (prefers-reduced-motion: reduce){
    .bat,.ghost,.spider,.moon,.fog,h1,.pumpkin{animation:none !important;}
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="moon"></div>
  <div class="fog"></div>
  <div class="fog b"></div>
  <div class="spider"><div class="thread"></div><span class="body">🕷️</span></div>

  <main class="content">
    <h1>Halloween Puzzle Party</h1>

    <div class="puzzles">
      <a class="puz" href="game1.html"><span>1</span></a>
      <a class="puz" href="game2.html"><span>2</span></a>
      <a class="puz" href="game3.html"><span>3</span></a>
      <a class="puz" href="game4.html"><span>4</span></a>
      <a class="puz" href="game5.html"><span>5</span></a>
      <a class="puz" href="game6.html"><span>6</span></a>
    </div>
  </main>

<script>
/* twinkling stars + rising embers */
(function(){
  const c = document.getElementById('sky');
  const ctx = c.getContext('2d');
  let w, h, stars = [], embers = [];
  function resize(){
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
    stars = Array.from({length: Math.min(150, Math.floor(w/9))}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*1.5 + .3, a: Math.random(), s: Math.random()*.02 + .004
    }));
    embers = Array.from({length: 24}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*2.4 + 1, vy: -(Math.random()*.5 + .22),
      vx: (Math.random()-.5)*.35, a: Math.random()*.5 + .3
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.a += s.s; if(s.a>1||s.a<.2) s.s*=-1;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283);
      ctx.fillStyle = `rgba(255,245,225,${s.a*.85})`; ctx.fill();
    }
    for(const e of embers){
      e.y += e.vy; e.x += e.vx;
      if(e.y < -10){ e.y = h + 10; e.x = Math.random()*w; }
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.283);
      ctx.fillStyle = `rgba(255,168,80,${e.a})`;
      ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,150,60,.9)';
      ctx.fill(); ctx.shadowBlur = 0;
    }
    requestAnimationFrame(draw);
  }
  resize(); draw();
  window.addEventListener('resize', resize);
})();

/* flying bats */
(function(){
  for(let i=0;i<4;i++){
    const el = document.createElement('div');
    el.className = 'bat';
    el.textContent = '🦇';
    el.style.top = (8 + Math.random()*48) + 'vh';
    el.style.fontSize = (16 + Math.random()*14) + 'px';
    el.style.animationDuration = (16 + Math.random()*14) + 's';
    el.style.animationDelay = (-Math.random()*20) + 's';
    document.body.appendChild(el);
  }
})();

/* floating ghosts */
(function(){
  const spots = [
    {top:'22vh', left:'8vw',  size:'28px', dur:'7s',  delay:'0s'},
    {top:'68vh', left:'86vw', size:'34px', dur:'9s',  delay:'-2s'},
    {top:'78vh', left:'12vw', size:'24px', dur:'8s',  delay:'-4s'},
  ];
  spots.forEach(s => {
    const el = document.createElement('div');
    el.className = 'ghost';
    el.textContent = '👻';
    el.style.top = s.top; el.style.left = s.left;
    el.style.fontSize = s.size;
    el.style.animationDuration = s.dur;
    el.style.animationDelay = s.delay;
    document.body.appendChild(el);
  });
})();

/* two dancing pumpkins */
(function(){
  ['left','right'].forEach(side => {
    const el = document.createElement('div');
    el.className = 'pumpkin ' + side;
    el.textContent = '🎃';
    document.body.appendChild(el);
  });
})();
</script>
<script src="music.js"></script>
</body>
</html>
